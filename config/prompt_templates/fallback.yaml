# Fallback templates
# Contains both fixed-response templates and model-fallback prompt templates.
# Fixed responses: used directly as the reply when fallback_strategy = "fixed"
# Model prompts: used as the prompt to the LLM when fallback_strategy = "model"
templates:
  # --- Fixed response templates ---
  - id: "default_fallback"
    name: "Standard Fallback"
    description: "Standard fallback response template"
    i18n:
      zh-CN:
        name: "标准兜底"
        description: "友好告知无法回答并提供建议"
      en-US:
        name: "Standard Fallback"
        description: "Friendly message with suggestions when unable to answer"
      ko-KR:
        name: "표준 폴백"
        description: "친절하게 답변 및 제안을 드릴 수 없음을 알려드립니다."
    default: true
    content: |
      抱歉，当前未能在知识库中找到与问题直接相关的内容。

      你可以尝试：
      1. 换一种方式描述问题
      2. 补充更具体的关键词、范围或背景
      3. 将复杂问题拆分成几个更具体的问题

      如果问题涉及特定领域，也可以提供相关文档或咨询专业人员。

      ## 语言要求
      - 必须使用 {{language}} 回答

  - id: "polite_fallback"
    name: "Polite Fallback"
    description: "More polite and friendly fallback response"
    i18n:
      zh-CN:
        name: "礼貌兜底"
        description: "更加礼貌详细的无法回答提示"
      en-US:
        name: "Polite Fallback"
        description: "More polite and detailed unable-to-answer message"
      ko-KR:
        name: "정중한 폴백"
        description: "더 정중하고 자세한 답변 불가 프롬프트"
    content: |
      抱歉，基于当前检索结果，我暂时无法准确回答这个问题。可能原因包括：
      - 当前问题超出已绑定知识库的内容范围
      - 知识库中尚未收录相关资料
      - 现有资料缺少必要的上下文或适用条件

      你可以尝试：
      1. 使用更具体的关键词重新提问
      2. 将问题拆分为更小的子问题
      3. 补充文档名称、版本、时间范围或业务背景

      ## 语言要求
      - 必须使用 {{language}} 回答

  - id: "brief_fallback"
    name: "Brief Fallback"
    description: "Short fallback response"
    i18n:
      zh-CN:
        name: "简洁兜底"
        description: "简短的无法回答提示"
      en-US:
        name: "Brief Fallback"
        description: "Short unable-to-answer message"
      ko-KR:
        name: "간단한 폴백"
        description: "대답할 수 없는 짧은 프롬프트"
    content: "抱歉，当前无法根据知识库内容确认这个问题。请尝试换一种方式提问，或补充更多具体信息。"

  # --- Model fallback prompt templates (for fallback_strategy = "model") ---
  - id: "model_fallback"
    name: "Model Fallback"
    description: "Fallback prompt that delegates to the model for generation"
    i18n:
      zh-CN:
        name: "模型兜底提示"
        description: "引导模型基于通用知识回答的提示词"
      en-US:
        name: "Model Fallback Prompt"
        description: "Prompt to guide model to answer with general knowledge"
      ko-KR:
        name: "모델 폴백 프롬프트"
        description: "일반 지식을 바탕으로 모델이 답변하도록 안내하는 프롬프트"
    mode: "model"
    content: |
      你是 {{brand}}，由当前部署团队提供的专业知识库助手。

      当前检索没有找到与用户问题直接匹配的内容，但知识库中存在以下文档列表：

      {{kb_documents}}

      ## 回答规则
      1. 如果文档列表中有明显相关的文档，只能据此向用户推荐文档或说明可能的查阅方向，不得假装已经获得文档正文。
      2. 如果文档列表为空或不相关，明确说明当前知识库没有足够依据，不得使用通用知识补答。
      3. 不得编造文档内容、来源、链接、数字、日期或结论。
      4. 如果问题需要实时信息，应说明当前知识库无法提供该信息；不要将未检索到的信息表述为事实。
      5. 保持客观、礼貌、简洁，并使用 {{language}} 回答。

      用户问题：{{query}}

  - id: "default_fallback_prompt"
    name: "Standard Fallback Prompt"
    description: "Default prompt that delegates to the model when KB has no relevant results"
    i18n:
      zh-CN:
        name: "标准兜底 Prompt"
        description: "知识库无相关结果时引导模型回答的默认提示词"
      en-US:
        name: "Standard Fallback Prompt"
        description: "Default prompt that delegates to the model when KB has no relevant results"
      ko-KR:
        name: "표준 폴백 프롬프트"
        description: "KB에 관련 결과가 없을 때 모델에 위임하는 기본 프롬프트"
    mode: "model"
    content: |
      你是 {{brand}}，由当前部署团队提供的专业、友好的知识库助手。

      当前搜索没有找到与用户问题直接匹配的内容。知识库中现有的文档列表如下：

      {{kb_documents}}

      ## 回答要求
      - 如果文档列表中有相关文档，可以列出文档名称、推荐查阅方向或概括列表中明确提供的信息，但不得虚构文档正文。
      - 如果文档列表为空或不相关，应明确说明当前知识库无法确认答案，不得使用通用知识补答。
      - 不得伪造事实、数字、日期、链接、图片或来源。
      - 涉及实时数据或个人隐私信息时，如实说明当前无法从知识库获取。
      - 使用礼貌、专业、简洁的中文回答。

      ## 用户问题
      {{query}}
